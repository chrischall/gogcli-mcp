version: 1
name: Google Classroom (gogcli)
slug: gogcli-mcp-classroom
summary: >-
  Extended Google Classroom MCP server via gogcli — auth + full Classroom
  support
command:
  # This package publishes a single bin; naming it keeps the install
  # unambiguous alongside its eight sibling packages.
  bin: gogcli-mcp-classroom
env:
  - name: GOG_CLIENT_ID
    required: false
    help: >-
      Google OAuth client id. Read by the Node wrapper at startup
      (bootstrap-auth.ts), which imports it into gog's keyring via a temp file
      together with GOG_CLIENT_SECRET, GOG_REFRESH_TOKEN and GOG_ACCOUNT — set
      all four or none. Like every *_TOKEN / *_SECRET / *_KEY / *_CREDENTIALS
      variable it is still stripped from each spawned `gog`'s environment;
      gog authenticates from its keyring under $HOME (see state.dataDir).
  - name: GOG_CLIENT_SECRET
    secret: true
    required: false
    help: >-
      Google OAuth client secret. Imported into gog's keyring at startup with
      GOG_CLIENT_ID; stripped from the spawned CLI's environment by runner.ts's
      *_SECRET rule.
  - name: GOG_REFRESH_TOKEN
    secret: true
    required: false
    help: >-
      Google OAuth refresh token (`gog auth tokens export` prints one). Imported
      into gog's keyring at startup with GOG_CLIENT_ID; stripped from the
      spawned CLI's environment by runner.ts's *_TOKEN rule. Changing it
      re-imports on the next start; an in-connector re-auth
      (gog_auth_add_url/complete) stays in effect until it changes.
  - name: GOG_ACCESS_TOKEN
    secret: true
    required: false
    help: >-
      Deliberately removed from the spawned CLI's environment by runner.ts, so
      that a stale directly-passed token cannot shadow gog's stored refresh
      credential. Leave unset.
  - name: GOG_ACCOUNT
    required: false
    help: >-
      The Google account to act as. Required for the startup auth bootstrap
      (the refresh token is imported under this email); otherwise defaults to
      gog's single/most recent account.
  - name: GOG_KEYRING_BACKEND
    required: false
    help: >-
      gog's credential store. Set to "file" on a headless host — there is no OS
      keychain — so the keyring lives on the persistent data dir.
  - name: GOG_KEYRING_PASSWORD
    secret: true
    required: false
    help: >-
      Encrypts gog's file keyring on the data dir. Required with
      GOG_KEYRING_BACKEND=file. Deliberately not stripped from the spawned
      CLI's environment — it is the one credential gog itself reads.
  - name: GOG_READONLY
    required: false
    help: >-
      Set to 1 to refuse every mutating operation. Recommended when the
      connector is shared or you only need reads.
  - name: GOG_PATH
    required: false
    help: >-
      Path to the `gog` binary. Leave unset when the dependency below supplies
      it; set it only to point at a binary you manage yourself.
  - name: GOG_TIMEZONE
    required: false
    help: >-
      The IANA zone gog itself formats its naive timestamps in. The wrapper
      reads it (naiveSourceTimeZone) to re-attach the correct offset, so it
      should match gog's own configuration. Falls back to DISPLAY_TZ, then to
      America/New_York.
  - name: DISPLAY_TZ
    required: false
    help: >-
      The IANA zone every rendered *Display field uses (displayTimeZone,
      default America/New_York). It does not read GOG_TIMEZONE — the fallback
      runs the other way, so this is also what GOG_TIMEZONE falls back to. An
      invalid value degrades to the default rather than throwing.
dependencies:
  # Every tool shells out to the `gog` CLI; without it the server starts and
  # then fails on the first call. This tag must track
  # packages/gogcli-mcp/src/runner.ts's MIN_GOG_VERSION (the floor the tools
  # assume). See CLAUDE.md "Required gog version" — bumping the floor means
  # bumping these nine pins, and the pin stored on each mcp-host registration.
  - kind: github-release
    repo: openclaw/gogcli
    tag: v0.40.0
    asset: "gogcli_*_linux_amd64.tar.gz"
    bin: [gog]
state:
  dataDir: true
  reason: >-
    `gog` keeps its authorised-account state and file keyring under $HOME, and
    the wrapper keeps its auth-bootstrap marker (~/.gogcli-mcp) there, so a
    restart neither re-imports an unchanged secret nor discards an
    in-connector re-auth. Without a persistent data dir every cold start has
    only what the env secrets can re-seed.
egress:
  allow:
    # Google OAuth token exchange and the Google REST APIs the CLI calls.
    - oauth2.googleapis.com
    - www.googleapis.com
    - googleapis.com
