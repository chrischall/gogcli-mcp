# Thin config — the fleet-wide shape lives in chrischall/workflows.
# Renders to: .github/dependabot.yml
# Regenerate with: scripts/rollout.sh <owner/repo> --execute --only dependabot
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Dependabot INFERS a commit prefix from recent history when this is unset,
    # which is why the fleet drifted into `chore(deps)`, `build(deps-dev)` and
    # `fix(deps)` with no config anywhere. Setting it makes the release
    # behaviour deterministic instead of a property of a repo's git log.
    #
    # `fix` for runtime dependencies, so a bump that changes what SHIPS cuts a
    # patch release and reaches consumers. `chore` for dev dependencies, which
    # ship nothing and stay out of the changelog. release-please reads the
    # squash subject, and the squash subject is this.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # `agents` is a PEER of @chrischall/mcp-connector, and the connector — not
      # this repo — decides which versions are supported. Its published peer range
      # is `>=0.17.3 <0.23.0`, so a bump to 0.23.x cannot install here at all:
      # npm dies with ERESOLVE before a single test runs.
      #
      # This is not hypothetical. agents 0.19.0 met the connector's then-peer of
      # `^0.17.3` and took out every consumer's dependabot PR simultaneously
      # (chrischall/mcp-connector#11 widened the peer to fix it). The ceiling
      # below mirrors that peer so dependabot stops proposing bumps the harness
      # cannot accept — versions inside the window still flow normally.
      #
      # When the connector widens its peer, raise this ceiling in the same pass:
      # every consumer is listed in that repo's CLAUDE.md blast-radius section.
      # Last raised 2026-09-08 alongside mcp-connector#56, which widened the
      # peer from <0.20.0 to <0.23.0 to admit agents 0.22.
      - dependency-name: agents
        versions:
          - ">=0.23.0"
      # `@cloudflare/vitest-pool-workers` pins `peer vitest@"^4.1.0"`, so vitest
      # 5 cannot install here at all — `npm ci` dies with ERESOLVE before a test
      # runs. This is the ONLY repo in the fleet using pool-workers, which is
      # why the fleet-wide vitest-5 rollout does not apply to it.
      #
      # This is a ceiling, not a permanent hold: lift it when Cloudflare ships
      # a pool-workers whose peer accepts vitest 5. Until then dependabot would
      # re-propose the major every week and it would fail every week (#337).
      # 4.x minors and patches still flow normally.
      - dependency-name: vitest
        versions:
          - ">=5.0.0"
      - dependency-name: "@vitest/coverage-v8"
        versions:
          - ">=5.0.0"
    groups:
      # Dependabot does NOT hand a dependency to the first group that matches
      # it. `PatternSpecificityCalculator` scores every matching group and the
      # highest score wins:
      #
      #   exact `pattern == name`      1000   (EXACT_MATCH_SCORE)
      #   group with NO `patterns` key  500   (NO_PATTERNS_SCORE)
      #   pattern with no wildcard      500
      #   wildcard   100 - 10*wildcards + max(len-5, 0)
      #
      # so "@vitest/*" scores 94 and loses @vitest/coverage-v8 to the
      # dev-dependencies group below, which declares no patterns at all and
      # therefore scores 500. On a MAJOR bump dev-dependencies cannot take it
      # either (minor/patch only), so it falls out of every group into a PR of
      # its own — and since vitest and its coverage provider peer-depend on
      # each other at an EXACT version, the two halves apart are unsatisfiable:
      # both PRs die on `npm ci` ERESOLVE and sit red with auto-merge armed
      # until someone pushes the pair by hand. That cost 19 repos on
      # 2026-09-07 and vibo-mcp #110/#113 the day after.
      #
      # Listing the exact name scores 1000, which is >= EXPLICIT_MEMBER_SCORE
      # and short-circuits the comparison, so nothing can outbid it. The
      # wildcard stays for any future @vitest/… package.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `ci`, not `fix`: an action version ships nothing to a consumer, so it
    # belongs in the hidden CI section rather than cutting a patch release.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        update-types:
          - minor
          - patch
