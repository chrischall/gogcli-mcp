name: release-please

# Thin stub: release-please runs in chrischall/workflows'
# reusable-release-please.yml, which also decides whether and what to publish.
# The publish job stays in THIS file (the publish steps are the mcp-publish
# composite action) because npm trusted publishing and mcp-publisher bind to
# this repo's workflow identity via OIDC.
#
# The release PR ships via `release-ready`: adding it starts the auto-review,
# and a passing review arms `ready-to-merge` → deferred CI → auto-merge. CI does
# not run until the review passes, so `release-ready` is "review then ship", not
# an instant CI arm.

on:
  push:
    branches: [main]
  # `republish_tag` re-fires the publish job for a tag that ALREADY EXISTS —
  # for a release whose tag and GitHub Release were cut but whose publish never
  # ran (chrischall/workflows#283). Blank on the ordinary path.
  workflow_dispatch:
    inputs:
      republish_tag:
        description: 'Existing tag to re-publish (e.g. v1.2.3). Blank = skip publish.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: chrischall/workflows/.github/workflows/reusable-release-please.yml@main
    with:
      republish_tag: ${{ inputs.republish_tag }}
    secrets:
      release_pat: ${{ secrets.RELEASE_PAT }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write    # npm provenance + mcp-publisher OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: chrischall/workflows/.github/actions/mcp-publish@main
        with:
          version: ${{ needs.release-please.outputs.version }}
          tag-name: ${{ needs.release-please.outputs.tag }}
          clawhub-token: ${{ secrets.CLAWHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Deploy the Fly backend at the released tag. Goes BEFORE the connector: the
  # halves are compatible in both directions, but a new Worker against an old
  # backend is the combination that leans on compatibility shims, so prefer the
  # other order. A failure here skips the connector too, leaving a consistent
  # pair rather than a half-updated one.
  deploy-runner:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: chrischall/workflows/.github/workflows/reusable-fly-deploy.yml@main
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      working-directory: fly-gog-runner
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Deploy the hosted connector Worker at the released tag, so what is live
  # tracks the release instead of drifting behind main. Deliberately not
  # `needs: publish` — the connector is independent of npm and the MCP registry,
  # so a registry hiccup should not leave it stale.
  deploy-connector:
    needs: [release-please, deploy-runner]
    if: needs.release-please.outputs.release_created == 'true'
    # Scoped down from the workflow-level contents:write/pull-requests:write
    # that release-please needs; deploying only reads the tree.
    permissions:
      contents: read
    uses: chrischall/workflows/.github/workflows/reusable-mcp-connector-deploy.yml@main
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
